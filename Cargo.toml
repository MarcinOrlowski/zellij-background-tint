[package]
name = "zellij-background-tint"
version = "0.1.0"
edition = "2021"
publish = false
description = "Subtly tint each Zellij pane's background from the active theme colour"
license = "MIT"
repository = "https://github.com/MarcinOrlowski/zellij-background-tint"
readme = "README.md"
keywords = ["zellij", "terminal", "plugin", "wasm"]
categories = ["command-line-utilities"]

[dependencies]
zellij-tile = "=0.44.0"

[profile.release]
lto = true
opt-level = "s"
strip = true
